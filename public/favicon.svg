<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="emeraldBg" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="50%" stop-color="#044e38" />
      <stop offset="100%" stop-color="#022c22" />
    </radialGradient>

    <!-- Metallic Gold Gradient Primary -->
    <linearGradient id="goldPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="55%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Inner Gold Shimmer -->
    <linearGradient id="goldShimmer" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>

    <!-- Emerald Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.6" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Badge Shadow -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#064e3b" flood-opacity="0.5" />
    </filter>

    <!-- Emblem Shadow -->
    <filter id="emblemShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Outer Squircle Container -->
  <rect x="20" y="20" width="472" height="472" rx="118" ry="118" fill="url(#emeraldBg)" stroke="url(#goldPrimary)" stroke-width="10" filter="url(#badgeShadow)" />
  
  <!-- Inner Metallic Accent Ring -->
  <rect x="36" y="36" width="440" height="440" rx="102" ry="102" fill="none" stroke="url(#goldShimmer)" stroke-width="2.5" stroke-opacity="0.6" />

  <!-- Background Geometric Islamic Pattern (8-pointed Rub el Hizb watermark) -->
  <g opacity="0.08" stroke="url(#goldPrimary)" stroke-width="3" fill="none" transform="translate(256, 256)">
    <rect x="-140" y="-140" width="280" height="280" rx="8" />
    <rect x="-140" y="-140" width="280" height="280" rx="8" transform="rotate(45)" />
    <circle r="120" stroke-width="2" />
    <circle r="80" stroke-width="2" />
  </g>

  <!-- Main Emblem Group -->
  <g filter="url(#goldGlow)">
    <g filter="url(#emblemShadow)" transform="translate(20, 10)">

      <!-- Crescent Moon (Modern 3D Smooth Curve) -->
      <path d="M 265,85 
               C 365,85 435,160 435,260 
               C 435,360 355,435 255,435 
               C 175,435 105,375 95,295 
               C 140,345 210,370 275,345 
               C 340,320 375,255 355,190 
               C 340,140 295,95 265,85 Z" 
            fill="url(#goldPrimary)" />

      <!-- Grand Mosque Dome Center Piece -->
      <!-- Main Central Dome -->
      <path d="M 170,370 
               C 170,265 215,200 260,200 
               C 305,200 350,265 350,370 Z" 
            fill="url(#goldShimmer)" opacity="0.95" />

      <!-- Inner Archway Door -->
      <path d="M 225,370 
               C 225,315 240,290 260,290 
               C 280,290 295,315 295,370 Z" 
            fill="#022c22" stroke="url(#goldPrimary)" stroke-width="3" />

      <!-- Minaret Spire Right -->
      <path d="M 365,370 L 365,225 L 380,225 L 380,370 Z" fill="url(#goldPrimary)" />
      <!-- Minaret Roof Cap -->
      <path d="M 360,225 L 372.5,175 L 385,225 Z" fill="url(#goldShimmer)" />
      <!-- Minaret Window -->
      <rect x="369" y="245" width="7" height="16" rx="3.5" fill="#022c22" />

      <!-- Dome Finial Crescent Tip -->
      <path d="M 260,150 
               C 252,150 245,157 245,165 
               C 245,173 252,180 260,180 
               C 268,180 275,173 275,165 
               C 275,157 268,150 260,150 Z 
               M 260,154 
               C 264,154 268,158 268,165 
               C 268,172 264,176 260,176 Z" 
            fill="url(#goldPrimary)" />
      <line x1="260" y1="180" x2="260" y2="200" stroke="url(#goldPrimary)" stroke-width="4" stroke-linecap="round" />

      <!-- Sparkling Stars Accent -->
      <!-- Large Star 1 -->
      <path d="M 160,130 L 164,145 L 179,149 L 164,153 L 160,168 L 156,153 L 141,149 L 156,145 Z" fill="#ffffff" filter="url(#goldGlow)" />
      <!-- Small Star 2 -->
      <path d="M 330,120 L 333,130 L 343,133 L 333,136 L 330,146 L 327,136 L 317,133 L 327,130 Z" fill="#fef08a" />
      <!-- Tiny Diamond Sparkle 3 -->
      <polygon points="120,210 124,217 131,221 124,225 120,232 116,225 109,221 116,217" fill="#ffffff" opacity="0.9" />

    </g>
  </g>
</svg>
